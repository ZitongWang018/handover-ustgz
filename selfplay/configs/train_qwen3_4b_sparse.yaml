# 消融 A：**纯稀疏 0/1 奖励**（论文式最素设定）
#
# 与 `train_qwen3_4b.yaml` 唯一的差别就是 `reward.use_sparse_only: true`
# —— 所有过程项清零，R = 1{won}。用来做「过程奖励 vs 纯稀疏」的消融对照。
#
# 用法（8 卡）：
#   cd ~/ztwang/selfplay
#   torchrun --nproc_per_node=8 src/train_grpo.py --config configs/train_qwen3_4b_sparse.yaml
#
# ⚠️ 预期现象：早期大量 group 会「全 0 → 组内 std=0 → advantage 全 0」，
#    `train_grpo.py` 会跳过这些迭代的更新（日志里 did_step=0、adv_abs_mean=0）。
#    这是稀疏奖励的固有代价，不是 bug。看曲线时重点看 `won_rate` 是否最终抬起来。

run:
  name: qwen3-4b-alfworld-grpo-sparse
  seed: 42
  output_dir: runs

model:
  path: $ZTWANG_MODEL_PATH
  # 同 train_qwen3_4b.yaml：必须 fp32，否则 AdamW 更新被 bf16 舍入抹掉。
  # 本文件与 train_qwen3_4b.yaml 的唯一差异是 reward.use_sparse_only=true（消融用）。
  dtype: float32
  attn_implementation: flash_attention_2   # 没有 flash-attn 就改成 sdpa
  gradient_checkpointing: true

env:
  config_path: configs/base_config.yaml
  split: train
  eval_split: eval_out_of_distribution
  max_episode_steps: 30
  n_tasks_per_iter: 2
  group_size: 4
  task_types: [1, 2, 3, 4, 5, 6]

rollout:
  max_new_tokens: 96
  temperature: 1.0
  top_p: 0.95
  repetition_penalty: 1.05
  max_context_tokens: 8192
  keep_recent_turns: 8
  invalid_action_mode: raw
  fuzzy_threshold: 0.6

reward:
  use_sparse_only: true                     # ★ 与主配置的唯一差别
  success: 1.0
  clip_min: -1.0
  clip_max: 2.0

train:
  total_iters: 300
  lr: 1.0e-6
  weight_decay: 0.0
  warmup_iters: 20
  clip_eps: 0.2
  max_grad_norm: 1.0
  adv_use_std: true
  micro_batch_size: 1
  save_every: 25
  eval_every: 25
  eval_tasks: 16
