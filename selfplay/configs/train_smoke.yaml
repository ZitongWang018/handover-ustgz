# 单卡冒烟训练配置：从 train_qwen3_4b.yaml 复制后改小，只为验证训练通路（不改 src/）。
#
# 用法：
#   cd ~/ztwang/selfplay
#   torchrun --nproc_per_node=1 --master_port=29511 src/train_grpo.py --config configs/train_smoke.yaml

run:
  name: qwen3-4b-alfworld-grpo
  seed: 42
  output_dir: runs

model:
  path: $ZTWANG_MODEL_PATH
  # 冒烟**故意保持 bfloat16**：这样 `update_rel` 若为 0，正好实证
  # "bf16 参数下 AdamW 更新被舍入抹掉"这个问题存在（正式配置已改为 float32）。
  dtype: bfloat16
  attn_implementation: sdpa        # 冒烟阶段固定 sdpa，稳
  gradient_checkpointing: true

env:
  config_path: configs/base_config.yaml
  split: train
  eval_split: eval_out_of_distribution
  max_episode_steps: 8             # 短局，省时间
  n_tasks_per_iter: 1
  group_size: 2                    # 每 iter 2 条轨迹
  task_types: [1, 2, 3, 4, 5, 6]

rollout:
  max_new_tokens: 64
  temperature: 1.0
  top_p: 0.95
  repetition_penalty: 1.05
  max_context_tokens: 8192
  keep_recent_turns: 12
  invalid_action_mode: raw
  fuzzy_threshold: 0.6

reward:
  use_sparse_only: false
  success: 1.0
  invalid_action_penalty: 0.10
  format_violation_penalty: 0.10
  repeat_penalty: 0.05
  valid_step_bonus: 0.01
  admissible_ratio_bonus: 0.0
  efficiency_bonus: 0.10
  step_penalty: 0.0
  clip_min: -1.0
  clip_max: 2.0

train:
  total_iters: 4
  lr: 1.0e-6
  weight_decay: 0.0
  warmup_iters: 2
  clip_eps: 0.2
  max_grad_norm: 1.0
  adv_use_std: true
  micro_batch_size: 1
  save_every: 2                    # it=1(第2轮) 与 it=3(第4轮) 各存一次 -> 验证只留一个
  eval_every: 100                  # 别触发评测
  eval_tasks: 16
