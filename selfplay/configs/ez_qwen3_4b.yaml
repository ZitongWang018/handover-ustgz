# Explorer-Zero 复现配置（ALFWorld × Qwen3-4B base）
# 数值除注明外均对齐论文 Table 3；标「补全/偏差」的是论文未披露或我们有意偏离处。
#
# 用法：
#   python src/ez_train.py --config configs/ez_qwen3_4b.yaml            # 完整 4 outer loops
#   python src/ez_train.py --config configs/ez_qwen3_4b.yaml --dry-run  # 冒烟（1+1 步）

run:
  name: ez-qwen3-4b-alfworld
  seed: 42
  output_dir: runs

model:
  path: $ZTWANG_MODEL_PATH            # 注意：论文用 Qwen3-4B **base**（非 instruct）
  # ★ bf16 基座（与主线 fp32 不同，这是有意的）：
  #   主线的 fp32 铁律来自"AdamW 直接更新 bf16 基座权重、更新量被舍入抹掉"。
  #   EZ 里基座**冻结**，只更新 LoRA adapter（peft 默认 fp32 创建），
  #   adapter 更新量 ~1e-4 远大于 fp32 ulp ~1e-7 —— 舍入问题不存在。
  #   收益：基座 16G -> 8G，省下的显存给 rollout batch（见 docs/GPU_UTILIZATION_PLAN.md）。
  dtype: bfloat16
  attn_implementation: flash_attention_2
  gradient_checkpointing: true
  lora: true                          # Table 3: LoRA r32 α32
  lora_r: 32
  lora_alpha: 32
  lora_targets: all-linear

env:
  config_path: configs/base_config.yaml
  split: train
  max_episode_steps: 30               # solver 最大回合（Table 3: 30）

proposer:
  max_turns: 30                       # T_P（Table 3）
  max_new_tokens: 160                 # 补全：附录未给
  temperature: 1.0                    # 补全：Table 3 未写采样温度
  give_admissible: false              # U3 决策点：默认不注入合法动作表（smoke 时对比）

solver:
  max_turns: 30
  max_new_tokens: 96
  temperature: 1.0
  max_context_tokens: 40960           # Table 3

train:
  outer_loops: 4                      # N（Table 3）
  proposer_steps: 25                  # M_P（Table 3）
  solver_steps: 25                    # M_S（Table 3）
  group_size: 16                      # G（Table 3）
  solve_rate_rollouts: 8              # G_P（Appendix C）
  tasks_per_step: 1                   # 忠实口径：每步 1 个 task group（论文未写死，取 1 与 Table 3 的 M_P=25 配对）
  lr: 1.0e-4                          # Table 3
  weight_decay: 0.0
  clip_eps: 0.3                       # Table 3: ε1=ε2=0.3
  # GRPO surrogate 的归约口径（2026-10-12 交叉 review 抓到的真 bug，已修）：
  #   seq   = 论文公式(4)语义：先每条序列内部按 token 平均，再组内等权 —— 默认
  #   token = 旧行为：组内所有 token 混在一起平均 = 按长度加权 → length bias
  #           实测 G=8/长度20~300/奖励4好4坏：seq 净信号恒 0，token 均值 0.149、
  #           最大 0.614，方向纯由长度决定（scripts/ez_repro_lossnorm.py）
  loss_norm: seq
  # 组内优势的标准差用无偏估计（ddof=1）还是总体标准差（ddof=0，numpy 默认）：
  #   ddof=1 = TRL/DeepSeekMath 口径 —— 默认
  #   ddof=0 = 旧行为，低估 std ⇒ 放大优势：G=16 放大 3.3%，G=2 放大 41%
  adv_ddof: 1
  max_grad_norm: 1.0
  w_sub: 0.3                          # Table 3
  w_div: 0.3                          # Table 3
  micro_batch_size: 1                 # accumulate all local samples before one update
  kl_beta: 0.001                      # frozen base reference via PEFT disable_adapter()
  sync_bucket_mb: 25
  check_adapter_sync_every: 5             # plus first update of every phase
  generation_max_batch_size: 8            # 忠实口径 TPS=1 时活跃 slot 只有 G_local=2；取 8 留余量
  # ★ 断点留多个 + 训练中间评测（2026-10-13 用户要求）
  checkpoint_keep: 4          # 每个 outer 结束存一份历史断点到 checkpoints/，保留最近 N 个（0=只留最新）
  eval_every_outer: 1         # 每 N 个 outer 评测一次 valid_unseen（0=关闭）
  eval_n_tasks: 16            # 每次评测的 valid_unseen task 数（0=全量 134 个）
  eval_batch: 2               # 评测 batch
  eval_max_steps: 30          # 评测最大回合
  solve_rate_batch_tasks: 4   # solve rate 每批任务数上界（代码会再与 TPS 取 min，TPS=1 时退化为逐任务）
