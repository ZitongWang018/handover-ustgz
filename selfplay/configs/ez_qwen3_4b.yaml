# Explorer-Zero 复现配置（ALFWorld × Qwen3-4B base）
# 数值除注明外均对齐论文 Table 3；标「补全/偏差」的是论文未披露或我们有意偏离处。
#
# 用法：
#   python src/ez_train.py --config configs/ez_qwen3_4b.yaml            # 完整 4 outer loops
#   python src/ez_train.py --config configs/ez_qwen3_4b.yaml --dry-run  # 冒烟（1+1 步）

run:
  name: ez-qwen3-4b-alfworld
  seed: 42
  output_dir: runs

model:
  path: $ZTWANG_MODEL_PATH            # 注意：论文用 Qwen3-4B **base**（非 instruct）
  # ★ bf16 基座（与主线 fp32 不同，这是有意的）：
  #   主线的 fp32 铁律来自"AdamW 直接更新 bf16 基座权重、更新量被舍入抹掉"。
  #   EZ 里基座**冻结**，只更新 LoRA adapter（peft 默认 fp32 创建），
  #   adapter 更新量 ~1e-4 远大于 fp32 ulp ~1e-7 —— 舍入问题不存在。
  #   收益：基座 16G -> 8G，省下的显存给 rollout batch（见 docs/GPU_UTILIZATION_PLAN.md）。
  dtype: bfloat16
  attn_implementation: flash_attention_2
  gradient_checkpointing: true
  lora: true                          # Table 3: LoRA r32 α32
  lora_r: 32
  lora_alpha: 32
  lora_targets: all-linear

env:
  config_path: configs/base_config.yaml
  split: train
  max_episode_steps: 30               # solver 最大回合（Table 3: 30）

proposer:
  max_turns: 30                       # T_P（Table 3）
  max_new_tokens: 160                 # 补全：附录未给
  temperature: 1.0                    # 补全：Table 3 未写采样温度
  give_admissible: false              # U3 决策点：默认不注入合法动作表（smoke 时对比）

solver:
  max_turns: 30
  max_new_tokens: 96
  temperature: 1.0
  max_context_tokens: 40960           # Table 3
  keep_recent_turns: 12               # 偏差：40960 理论上能留更多轮；先按主线保守值，smoke 后调

train:
  outer_loops: 4                      # N（Table 3）
  proposer_steps: 25                  # M_P（Table 3）
  solver_steps: 25                    # M_S（Table 3）
  group_size: 16                      # G（Table 3）
  solve_rate_rollouts: 8              # G_P（Appendix C）
  tasks_per_step: 2                   # 偏差 U5：论文 batch/rollouts 编排未写死，取务实值
  lr: 1.0e-4                          # Table 3
  weight_decay: 0.0
  clip_eps: 0.3                       # Table 3: ε1=ε2=0.3
  max_grad_norm: 1.0
  w_sub: 0.3                          # Table 3
  w_div: 0.3                          # Table 3
  # TODO(复现偏差): Table 3 的 KL penalty β=0.001 暂未实现（主线 GRPO 内核无参考模型）
